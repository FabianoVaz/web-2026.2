<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculadora">
        <div class="tela" id="visor">0</div>
        <div class="teclado">
            <button class="duplo funcao">C</button>
            <button class="funcao">x</button>
            <button class="operacao">/</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operacao">*</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operacao">-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operacao">+</button>
            
            <button class="duplo">0</button>
            <button>.</button>
            <button class="igual">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
