<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div><input type="hidden" id="entrada" value="5"></div>

    <div id="miolo"></div>    

    <script>
        let input = document.querySelector("#entrada");
        
        let miolo = document.querySelector("#miolo");
        for (let i = 1; i <= input.value; i++) {
            miolo.innerHTML += `<span class="itens">${i}</span>`;
        }
    </script>
</body>
</html>
